<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Street Noise Fest</title>
    <link rel="stylesheet" href="css/estilo-login.css">
</head>
<body class="bg-login">

    <main class="login-container">
        <section class="login-box">
            
            <div class="logo-container">
                <img src="imagenes/logo-festival.png" alt="Logo oficial de Street Noise Fest" class="login-logo">
            </div>

            <h1 class="neon-title">ACCESO AL RECINTO</h1>
            <p class="login-slogan">Underground Rap & Trap | 2026</p>

            <form action="pagina_principal.html" method="GET" class="login-form">
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="********" required>
                </div>

                <button type="submit" class="neon-button">ENTRAR AL RUIDO</button>
                
            </form>
        </section>
    </main>

</body>
</html>
